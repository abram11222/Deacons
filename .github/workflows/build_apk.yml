​"app/src/main/java/com/example/data/firebase/FirestoreSyncManager.kt": '''package com.example.data.firebase
​import android.util.Log
import com.example.data.database.DeaconsDatabase
import com.example.data.model.*
import com.google.firebase.firestore.DocumentSnapshot
import com.google.firebase.firestore.FirebaseFirestore
import com.google.firebase.firestore.ListenerRegistration
import com.google.firebase.firestore.SetOptions
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.launch
import kotlinx.coroutines.tasks.await
​sealed class SyncState {
object Idle : SyncState()
object Syncing : SyncState()
object Synced : SyncState()
data class Error(val message: String) : SyncState()
}
​class FirestoreSyncManager(
private val firestore: FirebaseFirestore,
private val database: DeaconsDatabase,
private val externalScope: CoroutineScope = CoroutineScope(Dispatchers.IO)
) {
private val TAG = "FirestoreSyncManager"
​private val _syncState = MutableStateFlow<SyncState>(SyncState.Idle)
val syncState: StateFlow<SyncState> = _syncState.asStateFlow()
​private var activeChurchCode: String? = null
​private var stagesListener: ListenerRegistration? = null
private var subjectsListener: ListenerRegistration? = null
private var membersListener: ListenerRegistration? = null
private var attendanceListener: ListenerRegistration? = null
private var assessmentsListener: ListenerRegistration? = null
​fun startRealtimeSync(churchCode: String) {
if (churchCode.isBlank()) return
if (activeChurchCode == churchCode && membersListener != null) return
​stopRealtimeSync()
activeChurchCode = churchCode
_syncState.value = SyncState.Syncing
​val churchDoc = firestore.collection("churches").document(churchCode)
​stagesListener = churchDoc.collection("stages")
.addSnapshotListener { snapshots, error ->
if (error != null) return@addSnapshotListener
snapshots?.let { docs ->
externalScope.launch(Dispatchers.IO) {
processRemoteStages(docs.documents)
}
}
}
​subjectsListener = churchDoc.collection("subjects")
.addSnapshotListener { snapshots, error ->
if (error != null) return@addSnapshotListener
snapshots?.let { docs ->
externalScope.launch(Dispatchers.IO) {
processRemoteSubjects(docs.documents)
}
}
}
​membersListener = churchDoc.collection("members")
.addSnapshotListener { snapshots, error ->
if (error != null) return@addSnapshotListener
snapshots?.let { docs ->
externalScope.launch(Dispatchers.IO) {
processRemoteMembers(docs.documents)
_syncState.value = SyncState.Synced
}
}
}
​attendanceListener = churchDoc.collection("attendance")
.addSnapshotListener { snapshots, error ->
if (error != null) return@addSnapshotListener
snapshots?.let { docs ->
externalScope.launch(Dispatchers.IO) {
processRemoteAttendance(docs.documents)
}
}
}
​assessmentsListener = churchDoc.collection("assessments")
.addSnapshotListener { snapshots, error ->
if (error != null) return@addSnapshotListener
snapshots?.let { docs ->
externalScope.launch(Dispatchers.IO) {
processRemoteAssessments(docs.documents)
}
}
}
​externalScope.launch(Dispatchers.IO) {
pushLocalPendingChanges()
}
}
​private suspend fun processRemoteStages(documents: List<DocumentSnapshot>) {
val stageDao = database.stageDao()
for (doc in documents) {
val firestoreId = doc.id
val updatedAt = doc.getLong("updatedAt") ?: 0L
val isDeleted = doc.getBoolean("isDeleted") ?: false
val name = doc.getString("name") ?: ""
val orderIndex = doc.getLong("orderIndex")?.toInt() ?: 0
​val local = stageDao.getStageByFirestoreId(firestoreId)
if (local == null) {
if (!isDeleted) {
stageDao.insertStage(StageEntity(firestoreId = firestoreId, name = name, orderIndex = orderIndex, updatedAt = updatedAt))
}
} else if (updatedAt > local.updatedAt) {
if (isDeleted) {
stageDao.hardDeleteStage(local.id)
} else {
stageDao.updateStage(local.copy(name = name, orderIndex = orderIndex, updatedAt = updatedAt))
}
}
}
}
​private suspend fun processRemoteSubjects(documents: List<DocumentSnapshot>) {
val subjectDao = database.subjectDao()
val stageDao = database.stageDao()
for (doc in documents) {
val firestoreId = doc.id
val updatedAt = doc.getLong("updatedAt") ?: 0L
val isDeleted = doc.getBoolean("isDeleted") ?: false
val name = doc.getString("name") ?: ""
val stageCloudId = doc.getString("stageCloudId") ?: ""
val maxScore = doc.getLong("maxScore")?.toInt() ?: 100
​val localStage = if (stageCloudId.isNotBlank()) stageDao.getStageByFirestoreId(stageCloudId) else null
val localStageId = localStage?.id
​val local = subjectDao.getSubjectByFirestoreId(firestoreId)
if (local == null) {
if (!isDeleted) {
subjectDao.insertSubject(SubjectEntity(firestoreId = firestoreId, name = name, stageId = localStageId, stageCloudId = stageCloudId, maxScore = maxScore, updatedAt = updatedAt))
}
} else if (updatedAt > local.updatedAt) {
if (isDeleted) {
subjectDao.hardDeleteSubject(local.id)
} else {
subjectDao.updateSubject(local.copy(name = name, stageId = localStageId, stageCloudId = stageCloudId, maxScore = maxScore, updatedAt = updatedAt))
}
}
}
}
​private suspend fun processRemoteMembers(documents: List<DocumentSnapshot>) {
val memberDao = database.memberDao()
val stageDao = database.stageDao()
for (doc in documents) {
val firestoreId = doc.id
val updatedAt = doc.getLong("updatedAt") ?: 0L
val isDeleted = doc.getBoolean("isDeleted") ?: false
val name = doc.getString("name") ?: ""
val phone = doc.getString("phone") ?: ""
val rank = doc.getString("rank") ?: ""
val stageCloudId = doc.getString("stageCloudId") ?: ""
val notes = doc.getString("notes") ?: ""
val birthDate = doc.getString("birthDate") ?: ""
val barcode = doc.getString("barcode")
val photoPath = doc.getString("photoPath")
val joinedDate = doc.getLong("joinedDate") ?: System.currentTimeMillis()
val isActive = doc.getBoolean("isActive") ?: true
​val localStage = if (stageCloudId.isNotBlank()) stageDao.getStageByFirestoreId(stageCloudId) else null
val localStageId = localStage?.id ?: 0L
​val local = memberDao.getMemberByFirestoreId(firestoreId)
if (local == null) {
if (!isDeleted) {
memberDao.insertMember(MemberEntity(firestoreId = firestoreId, name = name, phone = phone, stageId = localStageId, stageCloudId = stageCloudId, rank = rank, barcode = barcode, photoPath = photoPath, notes = notes, birthDate = birthDate, joinedDate = joinedDate, isActive = isActive, updatedAt = updatedAt))
}
} else if (updatedAt > local.updatedAt) {
if (isDeleted) {
memberDao.hardDeleteMember(local.id)
} else {
memberDao.updateMember(local.copy(name = name, phone = phone, stageId = localStageId, stageCloudId = stageCloudId, rank = rank, barcode = barcode, photoPath = photoPath ?: local.photoPath, notes = notes, birthDate = birthDate, joinedDate = joinedDate, isActive = isActive, updatedAt = updatedAt))
}
}
}
}
​private suspend fun processRemoteAttendance(documents: List<DocumentSnapshot>) {
val attendanceDao = database.attendanceDao()
val memberDao = database.memberDao()
for (doc in documents) {
val firestoreId = doc.id
val updatedAt = doc.getLong("updatedAt") ?: 0L
val isDeleted = doc.getBoolean("isDeleted") ?: false
val memberCloudId = doc.getString("memberCloudId") ?: ""
val date = doc.getString("date") ?: ""
val eventType = doc.getString("eventType") ?: "قداس"
val isPresent = doc.getBoolean("isPresent") ?: true
​val localMember = if (memberCloudId.isNotBlank()) memberDao.getMemberByFirestoreId(memberCloudId) else null
val localMemberId = localMember?.id ?: 0L
​val local = attendanceDao.getAttendanceByFirestoreId(firestoreId)
if (local == null) {
if (!isDeleted && localMemberId != 0L) {
attendanceDao.insertAttendance(AttendanceEntity(firestoreId = firestoreId, memberId = localMemberId, memberCloudId = memberCloudId, date = date, eventType = eventType, isPresent = isPresent, updatedAt = updatedAt))
}
} else if (updatedAt > local.updatedAt) {
if (isDeleted) {
attendanceDao.hardDeleteAttendance(local.id)
} else {
attendanceDao.updateAttendance(local.copy(memberId = if (localMemberId != 0L) localMemberId else local.memberId, memberCloudId = memberCloudId, date = date, eventType = eventType, isPresent = isPresent, updatedAt = updatedAt))
}
}
}
}
​private suspend fun processRemoteAssessments(documents: List<DocumentSnapshot>) {
val assessmentDao = database.assessmentDao()
val memberDao = database.memberDao()
val subjectDao = database.subjectDao()
for (doc in documents) {
val firestoreId = doc.id
val updatedAt = doc.getLong("updatedAt") ?: 0L
val isDeleted = doc.getBoolean("isDeleted") ?: false
val memberCloudId = doc.getString("memberCloudId") ?: ""
val subjectCloudId = doc.getString("subjectCloudId") ?: ""
val score = doc.getDouble("score") ?: 0.0
val maxScore = doc.getDouble("maxScore") ?: 100.0
val date = doc.getString("date") ?: ""
val notes = doc.getString("notes") ?: ""
​val localMember = if (memberCloudId.isNotBlank()) memberDao.getMemberByFirestoreId(memberCloudId) else null
val localSubject = if (subjectCloudId.isNotBlank()) subjectDao.getSubjectByFirestoreId(subjectCloudId) else null
​val localMemberId = localMember?.id ?: 0L
val localSubjectId = localSubject?.id ?: 0L
​val local = assessmentDao.getAssessmentByFirestoreId(firestoreId)
if (local == null) {
if (!isDeleted && localMemberId != 0L) {
assessmentDao.insertAssessment(AssessmentEntity(firestoreId = firestoreId, memberId = localMemberId, memberCloudId = memberCloudId, subjectId = localSubjectId, subjectCloudId = subjectCloudId, score = score, maxScore = maxScore, date = date, notes = notes, updatedAt = updatedAt))
}
} else if (updatedAt > local.updatedAt) {
if (isDeleted) {
assessmentDao.hardDeleteAssessment(local.id)
} else {
assessmentDao.updateAssessment(local.copy(memberId = if (localMemberId != 0L) localMemberId else local.memberId, memberCloudId = memberCloudId, subjectId = if (localSubjectId != 0L) localSubjectId else local.subjectId, subjectCloudId = subjectCloudId, score = score, maxScore = maxScore, date = date, notes = notes, updatedAt = updatedAt))
}
}
}
}
​suspend fun pushLocalPendingChanges() {
val churchCode = activeChurchCode ?: return
val churchDoc = firestore.collection("churches").document(churchCode)
try {
_syncState.value = SyncState.Syncing
​val stageDao = database.stageDao()
for (stage in stageDao.getPendingSyncStages()) {
val data = hashMapOf("name" to stage.name, "orderIndex" to stage.orderIndex, "updatedAt" to stage.updatedAt, "isDeleted" to stage.isDeleted)
churchDoc.collection("stages").document(stage.firestoreId).set(data, SetOptions.merge()).await()
if (stage.isDeleted) stageDao.hardDeleteStage(stage.id) else stageDao.updateStage(stage.copy(syncPending = false))
}
​val subjectDao = database.subjectDao()
for (subject in subjectDao.getPendingSyncSubjects()) {
val cloudStageId = if (subject.stageId != null) stageDao.getStageById(subject.stageId)?.firestoreId ?: "" else ""
val data = hashMapOf("name" to subject.name, "stageCloudId" to cloudStageId, "maxScore" to subject.maxScore, "updatedAt" to subject.updatedAt, "isDeleted" to subject.isDeleted)
churchDoc.collection("subjects").document(subject.firestoreId).set(data, SetOptions.merge()).await()
if (subject.isDeleted) subjectDao.hardDeleteSubject(subject.id) else subjectDao.updateSubject(subject.copy(stageCloudId = cloudStageId, syncPending = false))
}
​val memberDao = database.memberDao()
for (member in memberDao.getPendingSyncMembers()) {
val cloudStageId = stageDao.getStageById(member.stageId)?.firestoreId ?: ""
val data = hashMapOf("name" to member.name, "phone" to member.phone, "stageCloudId" to cloudStageId, "rank" to member.rank, "barcode" to member.barcode, "photoPath" to member.photoPath, "notes" to member.notes, "birthDate" to member.birthDate, "joinedDate" to member.joinedDate, "isActive" to member.isActive, "updatedAt" to member.updatedAt, "isDeleted" to member.isDeleted)
churchDoc.collection("members").document(member.firestoreId).set(data, SetOptions.merge()).await()
if (member.isDeleted) memberDao.hardDeleteMember(member.id) else memberDao.updateMember(member.copy(stageCloudId = cloudStageId, syncPending = false))
}
​val attendanceDao = database.attendanceDao()
for (att in attendanceDao.getPendingSyncAttendance()) {
val cloudMemberId = memberDao.getMemberByIdDirect(att.memberId)?.firestoreId ?: ""
val data = hashMapOf("memberCloudId" to cloudMemberId, "date" to att.date, "eventType" to att.eventType, "isPresent" to att.isPresent, "updatedAt" to att.updatedAt, "isDeleted" to att.isDeleted)
churchDoc.collection("attendance").document(att.firestoreId).set(data, SetOptions.merge()).await()
if (att.isDeleted) attendanceDao.hardDeleteAttendance(att.id) else attendanceDao.updateAttendance(att.copy(memberCloudId = cloudMemberId, syncPending = false))
}
​val assessmentDao = database.assessmentDao()
for (ass in assessmentDao.getPendingSyncAssessments()) {
val cloudMemberId = memberDao.getMemberByIdDirect(ass.memberId)?.firestoreId ?: ""
val cloudSubjectId = subjectDao.getSubjectById(ass.subjectId)?.firestoreId ?: ""
val data = hashMapOf("memberCloudId" to cloudMemberId, "subjectCloudId" to cloudSubjectId, "score" to ass.score, "maxScore" to ass.maxScore, "date" to ass.date, "notes" to ass.notes, "updatedAt" to ass.updatedAt, "isDeleted" to ass.isDeleted)
churchDoc.collection("assessments").document(ass.firestoreId).set(data, SetOptions.merge()).await()
if (ass.isDeleted) assessmentDao.hardDeleteAssessment(ass.id) else assessmentDao.updateAssessment(ass.copy(memberCloudId = cloudMemberId, subjectCloudId = cloudSubjectId, syncPending = false))
}
​_syncState.value = SyncState.Synced
} catch (e: Exception) {
Log.e(TAG, "Error pushing local changes: ${e.message}")
_syncState.value = SyncState.Error("خطأ في مزامنة البيانات: ${e.localizedMessage}")
}
}
​fun stopRealtimeSync() {
stagesListener?.remove(); stagesListener = null
subjectsListener?.remove(); subjectsListener = null
membersListener?.remove(); membersListener = null
attendanceListener?.remove(); attendanceListener = null
assessmentsListener?.remove(); assessmentsListener = null
activeChurchCode = null
_syncState.value = SyncState.Idle
}
}
