python - << 'EOF'
import os
import zipfile
import shutil
​# Find source zip
zip_files = [f for f in os.listdir('.') if f.lower().endswith('.zip')]
if zip_files:
target_zip = zip_files[0]
print(f"Extracting zip archive: {target_zip}")
with zipfile.ZipFile(target_zip, 'r') as zip_ref:
zip_ref.extractall('.')
print("Extraction complete.")
else:
print("Notice: No zip file found directly. Checking existing files...")
​# Move files if extracted into a nested folder
if not os.path.exists('app') and not os.path.exists('build.gradle.kts'):
for item in os.listdir('.'):
if os.path.isdir(item) and item not in ['.git', '.github']:
nested_app = os.path.join(item, 'app')
if os.path.exists(nested_app):
print(f"Moving files from nested folder '{item}' to project root...")
for sub_item in os.listdir(item):
src = os.path.join(item, sub_item)
dst = os.path.join('.', sub_item)
if not os.path.exists(dst):
shutil.move(src, dst)
break
​if not os.path.exists('app'):
print("CRITICAL: 'app' directory not found! Please make sure your source ZIP is uploaded to the repository.")
exit(1)
