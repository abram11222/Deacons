​"app/src/main/java/com/example/ui/viewmodel/DeaconsViewModel.kt": '''package com.example.ui.viewmodel
​import android.app.Application
import android.util.Log
import androidx.lifecycle.AndroidViewModel
import androidx.lifecycle.viewModelScope
import com.example.data.database.DeaconsDatabase
import com.example.data.firebase.*
import com.example.data.model.*
import com.example.data.repository.DeaconsRepository
import com.google.firebase.firestore.FirebaseFirestore
import kotlinx.coroutines.flow.*
import kotlinx.coroutines.launch
​class DeaconsViewModel(application: Application) : AndroidViewModel(application) {
​private val TAG = "DeaconsViewModel"
val database = DeaconsDatabase.getDatabase(application)
val firestore = FirebaseFirestore.getInstance()
​val syncManager = FirestoreSyncManager(firestore = firestore, database = database, externalScope = viewModelScope)
val repository = DeaconsRepository(database = database, syncManager = syncManager, coroutineScope = viewModelScope)
val userSession = FirebaseUserSession(application)
val userRepository = FirebaseUserRepository(userSession)
​val syncState: StateFlow<SyncState> = syncManager.syncState
val currentChurchCode: StateFlow<String?> = userSession.currentChurchCode
val currentUserProfile: StateFlow<FirebaseUserProfile?> = userSession.currentUserProfile
val isLoggedIn: StateFlow<Boolean> = userSession.isLoggedIn
​val isAdmin: StateFlow<Boolean> = currentUserProfile.map { profile ->
profile?.role?.equals("ADMIN", ignoreCase = true) == true
}.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), false)
​private val _churchServants = MutableStateFlow<List<FirebaseUserProfile>>(emptyList())
val churchServants: StateFlow<List<FirebaseUserProfile>> = _churchServants.asStateFlow()
​val allMembers: StateFlow<List<MemberEntity>> = repository.getAllMembers()
.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
​val allStages: StateFlow<List<StageEntity>> = repository.getAllStages()
.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
​val allSubjects: StateFlow<List<SubjectEntity>> = repository.getAllSubjects()
.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
​private val _searchQuery = MutableStateFlow("")
val searchQuery: StateFlow<String> = _searchQuery.asStateFlow()
​private val _selectedStageFilter = MutableStateFlow<Long?>(null)
val selectedStageFilter: StateFlow<Long?> = _selectedStageFilter.asStateFlow()
​val filteredMembers: StateFlow<List<MemberEntity>> = combine(allMembers, searchQuery, selectedStageFilter) { members, query, stageId ->
members.filter { member ->
val matchesQuery = query.isBlank() || member.name.contains(query, ignoreCase = true) || member.phone.contains(query)
val matchesStage = stageId == null || member.stageId == stageId
matchesQuery && matchesStage
}
}.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
​init {
viewModelScope.launch {
userSession.currentChurchCode.collectLatest { code ->
if (!code.isNullOrBlank()) {
syncManager.startRealtimeSync(code)
listenToChurchServants(code)
} else {
syncManager.stopRealtimeSync()
_churchServants.value = emptyList()
}
}
}
}
​private fun listenToChurchServants(churchCode: String) {
firestore.collection("users").whereEqualTo("churchCode", churchCode)
.addSnapshotListener { snapshots, error ->
if (error != null) return@addSnapshotListener
snapshots?.let { docs ->
_churchServants.value = docs.documents.mapNotNull { it.toObject(FirebaseUserProfile::class.java) }
}
}
}
​fun onSearchQueryChange(newQuery: String) { _searchQuery.value = newQuery }
fun onStageFilterChange(stageId: Long?) { _selectedStageFilter.value = stageId }
​fun addMember(member: MemberEntity, onComplete: ((Long) -> Unit)? = null) {
viewModelScope.launch {
val id = repository.insertMember(member)
onComplete?.invoke(id)
}
}
fun updateMember(member: MemberEntity) { viewModelScope.launch { repository.updateMember(member) } }
fun deleteMember(member: MemberEntity) { viewModelScope.launch { repository.deleteMember(member) } }
​fun addStage(name: String, orderIndex: Int) { viewModelScope.launch { repository.insertStage(StageEntity(name = name, orderIndex = orderIndex)) } }
fun updateStage(stage: StageEntity) { viewModelScope.launch { repository.updateStage(stage) } }
fun deleteStage(stage: StageEntity) { viewModelScope.launch { repository.deleteStage(stage) } }
​fun addSubject(name: String, stageId: Long?, maxScore: Int) { viewModelScope.launch { repository.insertSubject(SubjectEntity(name = name, stageId = stageId, maxScore = maxScore)) } }
fun updateSubject(subject: SubjectEntity) { viewModelScope.launch { repository.updateSubject(subject) } }
fun deleteSubject(subject: SubjectEntity) { viewModelScope.launch { repository.deleteSubject(subject) } }
​fun recordAttendance(memberId: Long, date: String, eventType: String, isPresent: Boolean) {
viewModelScope.launch { repository.insertAttendance(AttendanceEntity(memberId = memberId, date = date, eventType = eventType, isPresent = isPresent)) }
}
​fun recordAssessment(memberId: Long, subjectId: Long, score: Double, maxScore: Double, date: String, notes: String) {
viewModelScope.launch { repository.insertAssessment(AssessmentEntity(memberId = memberId, subjectId = subjectId, score = score, maxScore = maxScore, date = date, notes = notes)) }
}
​fun manualSyncNow() { viewModelScope.launch { syncManager.pushLocalPendingChanges() } }
​fun logout(onLoggedOut: () -> Unit) {
viewModelScope.launch {
syncManager.stopRealtimeSync()
userSession.clearSession()
onLoggedOut()
}
}
}
