​enum class AppScreen {
SPLASH, LOGIN, ADMIN_DASHBOARD, DASHBOARD, MEMBERS, ATTENDANCE, ASSESSMENTS, REPORTS, STAGES, SETTINGS, MEMBER_PROFILE
}
​class MainActivity : ComponentActivity() {
private val viewModel: DeaconsViewModel by viewModels()
​override fun onCreate(savedInstanceState: Bundle?) {
super.onCreate(savedInstanceState)
setContent {
DeaconsServiceTheme {
MainAppHost(viewModel = viewModel)
}
}
}
}
​@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun MainAppHost(viewModel: DeaconsViewModel) {
val isLoggedIn by viewModel.isLoggedIn.collectLatestState()
val isAdmin by viewModel.isAdmin.collectLatestState()
val syncState by viewModel.syncState.collectLatestState()
val churchCode by viewModel.currentChurchCode.collectLatestState()
​var currentScreen by rememberSaveable { mutableStateOf(AppScreen.SPLASH) }
var selectedMemberId by rememberSaveable { mutableStateOf(0L) }
​LaunchedEffect(isLoggedIn, isAdmin) {
if (currentScreen == AppScreen.SPLASH) {
kotlinx.coroutines.delay(1200)
currentScreen = if (isLoggedIn) {
if (isAdmin) AppScreen.ADMIN_DASHBOARD else AppScreen.DASHBOARD
} else {
AppScreen.LOGIN
}
}
}
​Scaffold(
bottomBar = {
if (isLoggedIn && currentScreen != AppScreen.LOGIN && currentScreen != AppScreen.SPLASH && currentScreen != AppScreen.MEMBER_PROFILE) {
NavigationBar {
if (isAdmin) {
NavigationBarItem(
selected = currentScreen == AppScreen.ADMIN_DASHBOARD,
onClick = { currentScreen = AppScreen.ADMIN_DASHBOARD },
icon = { Icon(Icons.Default.AdminPanelSettings, contentDescription = null) },
label = { Text("الأدمن") }
)
} else {
NavigationBarItem(
selected = currentScreen == AppScreen.DASHBOARD,
onClick = { currentScreen = AppScreen.DASHBOARD },
icon = { Icon(Icons.Default.Dashboard, contentDescription = null) },
label = { Text("الرئيسية") }
)
}
​NavigationBarItem(
selected = currentScreen == AppScreen.ATTENDANCE,
onClick = { currentScreen = AppScreen.ATTENDANCE },
icon = { Icon(Icons.Default.FactCheck, contentDescription = null) },
label = { Text("الحضور") }
)
​NavigationBarItem(
selected = currentScreen == AppScreen.MEMBERS,
onClick = { currentScreen = AppScreen.MEMBERS },
icon = { Icon(Icons.Default.Groups, contentDescription = null) },
label = { Text("الشمامسة") }
)
​NavigationBarItem(
selected = currentScreen == AppScreen.ASSESSMENTS,
onClick = { currentScreen = AppScreen.ASSESSMENTS },
icon = { Icon(Icons.Default.Grade, contentDescription = null) },
label = { Text("الدرجات") }
)
​NavigationBarItem(
selected = currentScreen == AppScreen.SETTINGS,
onClick = { currentScreen = AppScreen.SETTINGS },
icon = { Icon(Icons.Default.Settings, contentDescription = null) },
label = { Text("الإعدادات") }
)
}
}
},
topBar = {
if (isLoggedIn && currentScreen != AppScreen.LOGIN && currentScreen != AppScreen.SPLASH) {
Surface(modifier = Modifier.fillMaxWidth(), color = MaterialTheme.colorScheme.surfaceColorAtElevation(3.dp)) {
Row(
modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 6.dp),
verticalAlignment = Alignment.CenterVertically,
horizontalArrangement = Arrangement.SpaceBetween
) {
Row(verticalAlignment = Alignment.CenterVertically) {
Box(
modifier = Modifier.size(10.dp).clip(CircleShape).background(
when (syncState) {
is SyncState.Synced -> Color(0xFF4CAF50)
is SyncState.Syncing -> Color(0xFFFFA000)
is SyncState.Error -> Color.Red
else -> Color.Gray
}
)
)
Spacer(modifier = Modifier.width(6.dp))
Text(
text = when (syncState) {
is SyncState.Synced -> "سحابي لحظي (متزامن)"
is SyncState.Syncing -> "جاري المزامنة..."
is SyncState.Error -> "خطأ اتصال"
else -> "غير متصل"
},
fontSize = 11.sp,
fontWeight = FontWeight.SemiBold
)
}
​Row(verticalAlignment = Alignment.CenterVertically) {
Text(text = "كود: ${churchCode ?: "---"}", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
Spacer(modifier = Modifier.width(8.dp))
IconButton(onClick = { viewModel.logout { currentScreen = AppScreen.LOGIN } }, modifier = Modifier.size(24.dp)) {
Icon(Icons.Default.Logout, contentDescription = "خروج", tint = MaterialTheme.colorScheme.error, modifier = Modifier.size(16.dp))
}
}
}
}
}
}
) { paddingValues ->
Box(modifier = Modifier.fillMaxSize().padding(paddingValues)) {
Crossfade(targetState = currentScreen, label = "ScreenTransition") { screen ->
when (screen) {
AppScreen.SPLASH -> SplashScreen(onSplashFinished = { currentScreen = if (isLoggedIn) (if (isAdmin) AppScreen.ADMIN_DASHBOARD else AppScreen.DASHBOARD) else AppScreen.LOGIN })
AppScreen.LOGIN -> LoginScreen(viewModel = viewModel, onLoginSuccess = { currentScreen = if (isAdmin) AppScreen.ADMIN_DASHBOARD else AppScreen.DASHBOARD })
AppScreen.ADMIN_DASHBOARD -> AdminDashboardScreen(viewModel = viewModel, onNavigateToMembers = { currentScreen = AppScreen.MEMBERS }, onNavigateToAttendance = { currentScreen = AppScreen.ATTENDANCE }, onNavigateToStages = { currentScreen = AppScreen.STAGES }, onNavigateToReports = { currentScreen = AppScreen.REPORTS })
AppScreen.DASHBOARD -> DashboardScreen(viewModel = viewModel, onNavigateToMembers = { currentScreen = AppScreen.MEMBERS }, onNavigateToAttendance = { currentScreen = AppScreen.ATTENDANCE }, onNavigateToAssessments = { currentScreen = AppScreen.ASSESSMENTS }, onNavigateToReports = { currentScreen = AppScreen.REPORTS })
AppScreen.MEMBERS -> MembersScreen(viewModel = viewModel, onMemberClick = { memberId -> selectedMemberId = memberId; currentScreen = AppScreen.MEMBER_PROFILE })
AppScreen.ATTENDANCE -> AttendanceScreen(viewModel = viewModel)
AppScreen.ASSESSMENTS -> AssessmentsScreen(viewModel = viewModel)
AppScreen.REPORTS -> ReportsScreen(viewModel = viewModel)
AppScreen.STAGES -> MasterDataScreen(viewModel = viewModel)
AppScreen.SETTINGS -> SettingsScreen(viewModel = viewModel, onNavigateToAdmin = { currentScreen = AppScreen.ADMIN_DASHBOARD }, onLogout = { viewModel.logout { currentScreen = AppScreen.LOGIN } })
AppScreen.MEMBER_PROFILE -> MemberProfileScreen(memberId = selectedMemberId, viewModel = viewModel, onNavigateBack = { currentScreen = AppScreen.MEMBERS })
}
}
}
}
}
