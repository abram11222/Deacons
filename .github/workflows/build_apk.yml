​"app/src/main/java/com/example/data/database/DeaconsDatabase.kt": '''package com.example.data.database
​import android.content.Context
import androidx.room.Database
import androidx.room.Room
import androidx.room.RoomDatabase
import com.example.data.dao.*
import com.example.data.model.*
​@Database(
entities = [
MemberEntity::class,
StageEntity::class,
SubjectEntity::class,
AttendanceEntity::class,
AssessmentEntity::class
],
version = 2,
exportSchema = false
)
abstract class DeaconsDatabase : RoomDatabase() {
abstract fun memberDao(): MemberDao
abstract fun stageDao(): StageDao
abstract fun subjectDao(): SubjectDao
abstract fun attendanceDao(): AttendanceDao
abstract fun assessmentDao(): AssessmentDao
​companion object {
@Volatile
private var INSTANCE: DeaconsDatabase? = null
​fun getDatabase(context: Context): DeaconsDatabase {
return INSTANCE ?: synchronized(this) {
val instance = Room.databaseBuilder(
context.applicationContext,
DeaconsDatabase::class.java,
"deacons_service_db"
)
.fallbackToDestructiveMigration()
.build()
INSTANCE = instance
instance
}
}
}
}
