name: Build Deacons Service APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Project and Apply Firebase & Admin Updates
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import shutil

          zip_files = [f for f in os.listdir('.') if f.lower().endswith('.zip')]
          if zip_files:
              target_zip = zip_files[0]
              print(f"Extracting zip archive: {target_zip}")
              with zipfile.ZipFile(target_zip, 'r') as zip_ref:
                  zip_ref.extractall('.')
              print("Extraction complete.")
          else:
              print("Notice: No zip file found directly. Checking existing files...")

          if not os.path.exists('app') and not os.path.exists('build.gradle.kts'):
              for item in os.listdir('.'):
                  if os.path.isdir(item) and item not in ['.git', '.github']:
                      nested_app = os.path.join(item, 'app')
                      if os.path.exists(nested_app):
                          print(f"Moving files from nested folder '{item}' to project root...")
                          for sub_item in os.listdir(item):
                              src = os.path.join(item, sub_item)
                              dst = os.path.join('.', sub_item)
                              if not os.path.exists(dst):
                                  shutil.move(src, dst)
                          break

          if not os.path.exists('app'):
              print("CRITICAL: 'app' directory not found! Please make sure your source ZIP is uploaded to the repository.")
              exit(1)
          print("Project check passed.")
          EOF

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew was missing from zip archive. Generating it automatically..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
